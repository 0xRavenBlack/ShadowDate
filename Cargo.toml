[package]
name = "calendar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shadowdate"
path = "src/main.rs"

[[bin]]
name = "shadowdate-service"
path = "src/bin/shadowdate-service.rs"

[lib]
name = "calendar"
path = "src/lib.rs"

[dependencies]
gtk = { version = "0.11", package = "gtk4" }
glib = "0.22"
gio = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
ical = "0.11"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = "z"
panic = "abort"
strip = true
lto = true
codegen-units = 1
