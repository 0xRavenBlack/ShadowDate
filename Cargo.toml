[package]
name = "shadowdate"
version = "0.7.0"
edition = "2024"
description = "A gothic dark-pastel desktop calendar for Linux (Rust + GTK4) with iCalendar support and a background reminder service"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xRavenBlack/ShadowDate"
keywords = ["calendar", "appointments", "gtk4", "icalendar", "reminders"]
categories = ["gui", "date-and-time"]
rust-version = "1.85"

[[bin]]
name = "shadowdate"
path = "src/main.rs"

[[bin]]
name = "shadowdate-service"
path = "src/bin/shadowdate-service.rs"

[lib]
name = "shadowdate"
path = "src/lib.rs"

[dependencies]
gtk = { version = "0.11", package = "gtk4" }
glib = "0.22"
gio = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
ical = "0.11"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = "z"
panic = "abort"
strip = true
lto = true
codegen-units = 1
